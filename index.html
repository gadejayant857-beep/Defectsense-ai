<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>defectsense-ai</title>
  </head>
  <body>
    <div id="root"><div id="boot-status" style="min-height:100vh;background:#0b0f14;color:#f4f7f6;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div><h2 style="margin:0 0 8px">DefectSense AI</h2><p style="margin:0;color:#9aa6b2">Loading application...</p></div></div></div><script>window.addEventListener("error",function(e){document.body.innerHTML='<div style="min-height:100vh;background:#0b0f14;color:#f4f7f6;font-family:monospace;padding:32px;box-sizing:border-box"><h2>DefectSense Runtime Error</h2><pre style="white-space:pre-wrap;color:#ff6b6b">'+String(e.error||e.message||"Unknown JavaScript error")+'</pre></div>'});window.addEventListener("unhandledrejection",function(e){document.body.innerHTML='<div style="min-height:100vh;background:#0b0f14;color:#f4f7f6;font-family:monospace;padding:32px;box-sizing:border-box"><h2>DefectSense Promise Error</h2><pre style="white-space:pre-wrap;color:#ff6b6b">'+String(e.reason||"Unknown promise error")+'</pre></div>'})</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
